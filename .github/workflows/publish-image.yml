name: Publish training image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - start.sh
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/training-image
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /usr/lib/google-cloud-sdk \
            /usr/local/.ghcup \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift \
            || true
          sudo docker system prune -af || true
          if [ -d /mnt ]; then
            sudo systemctl stop docker
            sudo mkdir -p /mnt/docker /mnt/tmp
            sudo chmod 1777 /mnt/tmp
            sudo rm -rf /mnt/docker/*
            echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
            echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
          fi
          docker info
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke published image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -Eeuo pipefail
          key_dir="$(mktemp -d)"
          container_name="agora-training-image-smoke"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -rf "$key_dir"
            exit "$status"
          }
          trap cleanup EXIT

          ssh-keygen -q -t ed25519 -N '' -f "$key_dir/id_ed25519"
          docker pull "$IMAGE"
          docker run -d \
            --name "$container_name" \
            -e PUBLIC_KEY="$(cat "$key_dir/id_ed25519.pub")" \
            -p 127.0.0.1:2222:22 \
            "$IMAGE"

          for _ in $(seq 1 30); do
            if ssh -i "$key_dir/id_ed25519" -p 2222 \
              -o BatchMode=yes \
              -o ConnectTimeout=2 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              root@127.0.0.1 true 2>/dev/null; then
              break
            fi
            sleep 1
          done

          ssh -i "$key_dir/id_ed25519" -p 2222 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 \
            'set -eu; /opt/agora-venv/bin/python -c '\''import sys, torch, hivemind; assert sys.version_info[:2] == (3, 11); assert torch.__version__.startswith("2.7.")'\''; command -v git curl jq tmux ss crontab; pgrep -x sshd; pgrep -x cron'
