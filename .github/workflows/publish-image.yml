name: Publish training image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - image-repair-build-requirements.txt
      - start.sh
      - machine-sentinel/**
      - image-runtime/**
      - machine-runtime/**
      - tools/**
      - tests/**
      - .github/workflows/publish-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - image-repair-build-requirements.txt
      - start.sh
      - machine-sentinel/**
      - image-runtime/**
      - machine-runtime/**
      - tools/**
      - tests/**
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/training-image
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare bounded hosted-runner disk space
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS \
            python3 tools/prepare_hosted_runner.py \
              --evidence "$GITHUB_WORKSPACE/runner-preparation-evidence.json" \
              --github-env "$GITHUB_ENV"
          docker info
          df -h

      - name: Initialize timing evidence
        if: always()
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json \
            --path "$GITHUB_WORKSPACE" --path /mnt/docker --path /mnt/tmp \
            init --source-commit "$GITHUB_SHA"

      - name: Start Buildx setup timer
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json start buildx_setup

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Finish Buildx setup timer
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.buildx.outcome }}
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json finish buildx_setup \
            --status "$STEP_OUTCOME"

      - name: Resolve optional public inline cache
        id: cache_probe
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json start cache_lookup
          set +e
          digest="$(timeout 30s docker buildx imagetools inspect \
            "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null)"
          probe_rc=$?
          set -e
          if [ "$probe_rc" = 0 ] \
            && printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            cache_ref="type=registry,ref=${IMAGE_NAME}@${digest}"
            status=available
            echo "cache_from=$cache_ref" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif [ "$probe_rc" = 124 ]; then
            cache_ref=""
            status=timeout
          else
            cache_ref=""
            status=unavailable
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json cache \
            --status "$status" --reference "$cache_ref" \
            --exit-status "$probe_rc"
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json finish cache_lookup \
            --status success

      - name: Verify source artifacts
        run: |
          python3 -m py_compile image-runtime/*.py tools/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n start.sh tests/*.sh

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=candidate-${{ github.sha }}

      - name: Start build timer
        run: |
          echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json start build

      - name: Build local nonpublishing candidate
        if: github.event_name != 'push'
        id: build_local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          pull: true
          cache-from: ${{ steps.cache_probe.outputs.cache_from }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload untagged release candidate by digest
        if: github.event_name == 'push'
        id: build_release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          cache-from: ${{ steps.cache_probe.outputs.cache_from }}
          cache-to: type=inline
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push=true,push-by-digest=true,name-canonical=true

      - name: Finish build timer
        if: always()
        env:
          LOCAL_OUTCOME: ${{ steps.build_local.outcome }}
          RELEASE_OUTCOME: ${{ steps.build_release.outcome }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            outcome="$RELEASE_OUTCOME"
          else
            outcome="$LOCAL_OUTCOME"
          fi
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json finish build \
            --status "$outcome"

      - name: Select exact smoke image
        env:
          TAGGED_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          LOCAL_DIGEST: ${{ steps.build_local.outputs.digest }}
          RELEASE_DIGEST: ${{ steps.build_release.outputs.digest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test -n "$RELEASE_DIGEST"
            echo "SMOKE_IMAGE=${IMAGE_NAME}@${RELEASE_DIGEST}" >> "$GITHUB_ENV"
            echo "BUILD_DIGEST=${RELEASE_DIGEST}" >> "$GITHUB_ENV"
          else
            test -n "$LOCAL_DIGEST"
            echo "SMOKE_IMAGE=$TAGGED_IMAGE" >> "$GITHUB_ENV"
            echo "BUILD_DIGEST=${LOCAL_DIGEST}" >> "$GITHUB_ENV"
          fi

      - name: Smoke exact built image
        id: smoke_image
        env:
          IMAGE: ${{ env.SMOKE_IMAGE }}
          BUILD_DIGEST: ${{ env.BUILD_DIGEST }}
          SMOKE_EVIDENCE: image-smoke-evidence.json
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json start image_smoke
          bash tests/smoke-image-runtime.sh

      - name: Finish image smoke timer
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.smoke_image.outcome }}
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json finish image_smoke \
            --status "$STEP_OUTCOME"

      - name: Smoke Machine Sentinel protocol
        id: smoke_sentinel
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json start sentinel_smoke
          bash tests/smoke-machine-sentinel.sh

      - name: Finish Machine Sentinel smoke timer
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.smoke_sentinel.outcome }}
        run: |
          python3 tools/build_evidence.py \
            --output image-build-timing-evidence.json finish sentinel_smoke \
            --status "$STEP_OUTCOME"

      - name: Promote tested digest to full commit tag
        if: github.event_name == 'push'
        id: promote_commit
        continue-on-error: true
        env:
          CANDIDATE_DIGEST: ${{ env.BUILD_DIGEST }}
          COMMIT_TAG: sha-${{ github.sha }}
        run: |
          set +e
          create_rc=0
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${COMMIT_TAG}" \
            "${IMAGE_NAME}@${CANDIDATE_DIGEST}" || create_rc=$?
          promoted_digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${COMMIT_TAG}" --format '{{.Manifest.Digest}}' \
            2>/dev/null)"
          inspect_rc=$?
          set -e
          echo "digest=$promoted_digest" >> "$GITHUB_OUTPUT"
          test "$create_rc" = 0
          test "$inspect_rc" = 0
          test "$promoted_digest" = "$CANDIDATE_DIGEST"

      - name: Promote tested digest to latest
        if: github.event_name == 'push' && steps.promote_commit.outcome == 'success'
        id: promote_latest
        continue-on-error: true
        env:
          CANDIDATE_DIGEST: ${{ env.BUILD_DIGEST }}
        run: |
          set +e
          create_rc=0
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${CANDIDATE_DIGEST}" || create_rc=$?
          promoted_digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}' \
            2>/dev/null)"
          inspect_rc=$?
          set -e
          echo "digest=$promoted_digest" >> "$GITHUB_OUTPUT"
          test "$create_rc" = 0
          test "$inspect_rc" = 0
          test "$promoted_digest" = "$CANDIDATE_DIGEST"

      - name: Record tested build and promotion evidence
        id: record_evidence
        if: always() && steps.smoke_image.outcome == 'success' && steps.smoke_sentinel.outcome == 'success'
        env:
          IMAGE: ${{ env.SMOKE_IMAGE }}
          BUILD_DIGEST: ${{ env.BUILD_DIGEST }}
          COMMIT_TAG: sha-${{ github.sha }}
          COMMIT_PROMOTION: ${{ steps.promote_commit.outcome }}
          COMMIT_TAG_DIGEST: ${{ steps.promote_commit.outputs.digest }}
          LATEST_PROMOTION: ${{ steps.promote_latest.outcome }}
          LATEST_TAG_DIGEST: ${{ steps.promote_latest.outputs.digest }}
          CACHE_STATUS: ${{ steps.cache_probe.outputs.status }}
          CACHE_DIGEST: ${{ steps.cache_probe.outputs.digest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            candidate_upload=uploaded_untagged
            if [ "$COMMIT_TAG_DIGEST" = "$BUILD_DIGEST" ] \
              && [ "$LATEST_TAG_DIGEST" = "$BUILD_DIGEST" ]; then
              promotion_status=complete
            elif [ "$COMMIT_TAG_DIGEST" = "$BUILD_DIGEST" ] \
              || [ "$LATEST_TAG_DIGEST" = "$BUILD_DIGEST" ]; then
              promotion_status=partial
            else
              promotion_status=failed
            fi
          else
            candidate_upload=local_only
            promotion_status=not_applicable
          fi
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$BUILD_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            --arg platform "linux/amd64" \
            --arg candidateUpload "$candidate_upload" \
            --arg promotionStatus "$promotion_status" \
            --arg commitTag "$COMMIT_TAG" \
            --arg commitPromotion "$COMMIT_PROMOTION" \
            --arg commitTagDigest "$COMMIT_TAG_DIGEST" \
            --arg latestPromotion "$LATEST_PROMOTION" \
            --arg latestTagDigest "$LATEST_TAG_DIGEST" \
            --arg cacheStatus "$CACHE_STATUS" \
            --arg cacheDigest "$CACHE_DIGEST" \
            --argjson buildSeconds "$(( $(date +%s) - BUILD_STARTED_AT ))" \
            --slurpfile timing image-build-timing-evidence.json \
            '{schemaVersion:"agora.image-build-evidence.v1", image:$image,
              buildDigest:$digest, testedDigest:$digest, knownGoodDigest:$digest,
              sourceCommit:$commit, platform:$platform,
              candidateUpload:{status:$candidateUpload},
              testing:{imageRuntime:"passed",machineSentinel:"passed"},
              promotion:{status:$promotionStatus,commitTag:$commitTag,
                commitOutcome:$commitPromotion,
                commitTagDigest:$commitTagDigest,latestTag:"latest",
                latestOutcome:$latestPromotion,latestTagDigest:$latestTagDigest},
              buildAndSmokeSeconds:$buildSeconds,
              cache:{status:$cacheStatus,digest:$cacheDigest},
              timing:$timing[0]}' \
            > image-build-evidence.json

      - name: Fail incomplete release promotion
        if: always() && github.event_name == 'push' && steps.smoke_image.outcome == 'success' && steps.smoke_sentinel.outcome == 'success' && (steps.promote_commit.outcome != 'success' || steps.promote_latest.outcome != 'success')
        run: |
          printf '%s\n' 'tested digest promotion was incomplete; see uploaded evidence' >&2
          exit 1

      - name: Upload build and container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-image-evidence-${{ github.sha }}
          path: |
            image-build-evidence.json
            image-build-timing-evidence.json
            image-smoke-evidence.json
            runner-preparation-evidence.json
            .smoke-failures/
          include-hidden-files: true
          if-no-files-found: warn
