name: Publish training image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - start.sh
      - machine-sentinel/**
      - image-runtime/**
      - machine-runtime/**
      - tools/**
      - tests/**
      - .github/workflows/publish-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - start.sh
      - machine-sentinel/**
      - image-runtime/**
      - machine-runtime/**
      - tools/**
      - tests/**
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/training-image
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /usr/lib/google-cloud-sdk \
            /usr/local/.ghcup \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift \
            || true
          sudo docker system prune -af || true
          if [ -d /mnt ]; then
            sudo systemctl stop docker
            sudo mkdir -p /mnt/docker /mnt/tmp
            sudo chmod 1777 /mnt/tmp
            sudo rm -rf /mnt/docker/*
            echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
            echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
          fi
          docker info
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify source artifacts
        run: |
          python3 -m py_compile image-runtime/*.py tools/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n start.sh tests/*.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Start build timer
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select exact smoke image
        env:
          TAGGED_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "SMOKE_IMAGE=$TAGGED_IMAGE" >> "$GITHUB_ENV"
          else
            echo "SMOKE_IMAGE=${IMAGE_NAME}@${PUBLISHED_DIGEST}" >> "$GITHUB_ENV"
          fi

      - name: Smoke exact built image
        env:
          IMAGE: ${{ env.SMOKE_IMAGE }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE_EVIDENCE: image-smoke-evidence.json
        run: bash tests/smoke-image-runtime.sh

      - name: Smoke Machine Sentinel protocol
        run: bash tests/smoke-machine-sentinel.sh

      - name: Record build provenance
        env:
          IMAGE: ${{ env.SMOKE_IMAGE }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$BUILD_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            --arg platform "linux/amd64" \
            --argjson buildSeconds "$(( $(date +%s) - BUILD_STARTED_AT ))" \
            '{schemaVersion:"agora.image-build-evidence.v1", image:$image,
              digest:$digest, sourceCommit:$commit, platform:$platform,
              buildAndSmokeSeconds:$buildSeconds}' \
            > image-build-evidence.json

      - name: Upload build and container evidence
        uses: actions/upload-artifact@v4
        with:
          name: training-image-evidence-${{ github.sha }}
          path: |
            image-build-evidence.json
            image-smoke-evidence.json
          if-no-files-found: error
